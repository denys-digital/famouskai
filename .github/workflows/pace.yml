# Keeps contributions at the pace announced by a "pace: N days" label:
# reminder and "help wanted" after half the time, maintainer takeover at the end.
# Rule for contributors: .github/CONTRIBUTING.md, "Inactive contributions".
# Script: .github/pace.js. Runs once a day and on demand (Actions tab > pace > Run workflow).
name: pace

on:
  schedule:
    - cron: '17 0 * * *'   # 09:17 JST
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (write the decisions to the job summary, change nothing)'
        type: boolean
        required: false
        default: true
      maintainers:
        description: 'Maintainer logins, comma separated (empty = denys-digital)'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Remind, open to help, or take over
        uses: actions/github-script@v7
        with:
          script: |
            const inputs = context.payload.inputs || {};
            const dryRun = context.eventName === 'workflow_dispatch' && String(inputs.dry_run) !== 'false';
            const maintainers = String(inputs.maintainers || '').split(',').map(s => s.trim()).filter(Boolean);
            return await require('./.github/pace.js')({ github, context, core, dryRun, maintainers });
