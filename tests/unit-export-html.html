<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Test - Export HTML & CSP Meta Tag (ext-export-html.js)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1e1e1e;
            color: #d4d4d4;
            margin: 20px;
            line-height: 1.5;
        }
        h1 {
            color: #569cd6;
            font-size: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }
        .summary {
            font-weight: bold;
            font-size: 16px;
            margin: 15px 0;
            padding: 10px;
            border-radius: 4px;
        }
        .summary.passed {
            background-color: #1e3a1e;
            color: #4ec9b0;
            border: 1px solid #2e5a2e;
        }
        .summary.failed {
            background-color: #3a1e1e;
            color: #f44747;
            border: 1px solid #5a2e2e;
        }
        .test-case {
            margin-bottom: 8px;
            padding: 8px 12px;
            border-radius: 4px;
            background-color: #252526;
            font-family: monospace;
            font-size: 13px;
        }
        .test-case.pass {
            border-left: 4px solid #4ec9b0;
        }
        .test-case.fail {
            border-left: 4px solid #f44747;
        }
        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
            margin-right: 8px;
            font-size: 11px;
        }
        .badge.pass {
            background-color: #4ec9b0;
            color: #1e1e1e;
        }
        .badge.fail {
            background-color: #f44747;
            color: #ffffff;
        }
        .diff-details {
            margin-top: 6px;
            padding: 6px;
            background-color: #1a1a1a;
            border-radius: 3px;
            color: #ce9178;
            white-space: pre-wrap;
        }
    </style>
    <script src="../plugins/ext-export-html.js"></script>
</head>
<body>
    <h1>Unit Test - Export HTML &amp; CSP Meta Tag (ext-export-html.js)</h1>
    <div id="summary" class="summary">Running tests...</div>
    <div id="test-results"></div>

    <script>
        (function() {
            const container = document.getElementById('test-results');
            const summaryEl = document.getElementById('summary');

            if (!window.FamousPluginCore || !window.FamousPluginCore.ExportHTML) {
                summaryEl.className = 'summary failed';
                summaryEl.textContent = 'Error: ExportHTML not defined on window.FamousPluginCore';
                return;
            }

            const ExportHTML = window.FamousPluginCore.ExportHTML;
            const EXPECTED_CSP = "default-src 'none'; img-src data: https:; style-src 'unsafe-inline'; font-src data:";

            const testCases = [
                {
                    name: "CSP meta tag is the first child of <head>",
                    test: function() {
                        const html = ExportHTML.buildStandaloneHTML("Test Title", "<p>Hello</p>", "body { color: red; }", "fr");
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(html, "text/html");
                        const head = doc.head;
                        if (!head) return false;
                        const firstChild = head.firstElementChild;
                        if (!firstChild || firstChild.tagName.toLowerCase() !== "meta") return false;
                        return firstChild.getAttribute("http-equiv") === "Content-Security-Policy";
                    }
                },
                {
                    name: "CSP content matches required policy exactly",
                    test: function() {
                        const html = ExportHTML.buildStandaloneHTML("Test Title", "<p>Hello</p>", "body { color: red; }", "en");
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(html, "text/html");
                        const meta = doc.head.querySelector('meta[http-equiv="Content-Security-Policy"]');
                        if (!meta) return false;
                        return meta.getAttribute("content") === EXPECTED_CSP;
                    }
                },
                {
                    name: "Document structure has doctype, lang, charset, viewport, title, and body",
                    test: function() {
                        const html = ExportHTML.buildStandaloneHTML("Doc Title", "<h1>Content</h1>", ".h1 { font-size: 2em; }", "en");
                        if (!html.startsWith("<!DOCTYPE html>")) return false;
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(html, "text/html");
                        if (doc.documentElement.getAttribute("lang") !== "en") return false;
                        if (doc.title !== "Doc Title") return false;
                        const charsetMeta = doc.head.querySelector('meta[charset="UTF-8"]');
                        const viewportMeta = doc.head.querySelector('meta[name="viewport"]');
                        const styleTag = doc.head.querySelector('style');
                        const bodyContent = doc.body.querySelector('.markdown-body');
                        return !!(charsetMeta && viewportMeta && styleTag && bodyContent && bodyContent.innerHTML.includes("<h1>Content</h1>"));
                    }
                },
                {
                    name: "getExportFileName formats timestamp correctly",
                    test: function() {
                        const fileName = ExportHTML.getExportFileName("my-notes.md");
                        return /^my-notes_\d{4}-\d{2}-\d{2}--\d{2}-\d{2}\.html$/.test(fileName);
                    }
                },
                {
                    name: "filterMarkdownBodyCSS strips @media print and diff2html rules",
                    test: function() {
                        const sampleCSS = ".markdown-body { color: #fff; } @media print { body { color: #000; } } .d2h-body { font-size: 12px; }";
                        const filtered = ExportHTML.filterMarkdownBodyCSS(sampleCSS);
                        return filtered.includes(".markdown-body") && !filtered.includes("@media print") && !filtered.includes(".d2h-body");
                    }
                },
                {
                    name: "Dark export: theme checkbox present and checked, body class set",
                    test: function() {
                        const html = ExportHTML.buildStandaloneHTML("T", "<p>x</p>", "", "en", true);
                        const doc = new DOMParser().parseFromString(html, "text/html");
                        const box = doc.getElementById("fmk-export-dark");
                        const label = doc.querySelector("label.fmk-export-theme-switch");
                        return !!(box && box.type === "checkbox" && box.checked && label && label.contains(box)
                            && label.textContent.trim() === "Dark theme"
                            && doc.body.classList.contains("fmk-export-page"));
                    }
                },
                {
                    name: "Light export: theme checkbox present and unchecked (also when the flag is omitted)",
                    test: function() {
                        const html = ExportHTML.buildStandaloneHTML("T", "<p>x</p>", "", "en", false);
                        const legacy = ExportHTML.buildStandaloneHTML("T", "<p>x</p>", "", "en");
                        const parse = h => new DOMParser().parseFromString(h, "text/html").getElementById("fmk-export-dark");
                        const a = parse(html), b = parse(legacy);
                        return !!(a && !a.checked && b && !b.checked);
                    }
                },
                {
                    name: "Exported file has no script and keeps the CSP (dark and light)",
                    test: function() {
                        return [true, false].every(function(dark) {
                            const html = ExportHTML.buildStandaloneHTML("T", "<p>x</p>", "", "en", dark);
                            const doc = new DOMParser().parseFromString(html, "text/html");
                            const meta = doc.head.querySelector('meta[http-equiv="Content-Security-Policy"]');
                            return doc.querySelectorAll("script").length === 0 && !/<script/i.test(html)
                                && meta && meta.getAttribute("content") === EXPECTED_CSP;
                        });
                    }
                },
                {
                    name: "rewriteDarkSelectors binds dark rules to the checkbox",
                    test: function() {
                        const css = ".markdown-body.preview-dark { color: red; } .markdown-body.preview-dark h1, .markdown-body.preview-dark a { color: blue; } .markdown-body h2 { color: green; } .markdown-body.preview-darker { color: pink; }";
                        const out = ExportHTML.rewriteDarkSelectors(css);
                        return out === "body:has(#fmk-export-dark:checked) .markdown-body { color: red; } body:has(#fmk-export-dark:checked) .markdown-body h1, body:has(#fmk-export-dark:checked) .markdown-body a { color: blue; } .markdown-body h2 { color: green; } .markdown-body.preview-darker { color: pink; }";
                    }
                },
                {
                    name: "buildThemeVariablesCSS resolves used variables (chained ones too), skips undefined ones",
                    test: function() {
                        const el = document.createElement("div");
                        el.style.setProperty("--fm-dark", "#202124");
                        el.style.setProperty("--color-bg-app", "var(--fm-dark)");
                        el.style.setProperty("--color-unused", "#ffffff");
                        document.body.appendChild(el);
                        const out = ExportHTML.buildThemeVariablesCSS("a { background: var(--color-bg-app); color: var(--color-missing, #000); }", el);
                        el.remove();
                        return out === ":root {\n    --color-bg-app: #202124;\n}";
                    }
                },
                {
                    name: "isPreviewDark reads the preview-dark class of #preview-render",
                    test: function() {
                        const el = document.createElement("div");
                        el.id = "preview-render";
                        document.body.appendChild(el);
                        const light = ExportHTML.isPreviewDark();
                        el.classList.add("preview-dark");
                        const dark = ExportHTML.isPreviewDark();
                        el.remove();
                        return light === false && dark === true && ExportHTML.isPreviewDark() === false;
                    }
                },
                {
                    name: "Text size switch: one radio per size (15, 18, 23), the given size checked, default 15",
                    test: function() {
                        const ids = h => {
                            const doc = new DOMParser().parseFromString(h, "text/html");
                            const radios = [...doc.querySelectorAll('.fmk-export-text-switch input[type="radio"][name="fmk-export-text"]')];
                            return radios.map(r => r.id + (r.checked ? ":on" : "")).join(",");
                        };
                        const at18 = ids(ExportHTML.buildStandaloneHTML("T", "<p>x</p>", "", "en", false, 18));
                        const legacy = ids(ExportHTML.buildStandaloneHTML("T", "<p>x</p>", "", "en"));
                        const bad = ids(ExportHTML.buildStandaloneHTML("T", "<p>x</p>", "", "en", true, 99));
                        return at18 === "fmk-export-text-15,fmk-export-text-18:on,fmk-export-text-23"
                            && legacy === "fmk-export-text-15:on,fmk-export-text-18,fmk-export-text-23"
                            && bad === legacy;
                    }
                },
                {
                    name: "getPreviewTextSize reads data-text-size of #preview-render (15 when absent or unknown)",
                    test: function() {
                        const none = ExportHTML.getPreviewTextSize();
                        const el = document.createElement("div");
                        el.id = "preview-render";
                        document.body.appendChild(el);
                        const plain = ExportHTML.getPreviewTextSize();
                        el.setAttribute("data-text-size", "23");
                        const big = ExportHTML.getPreviewTextSize();
                        el.setAttribute("data-text-size", "40");
                        const unknown = ExportHTML.getPreviewTextSize();
                        el.remove();
                        return none === 15 && plain === 15 && big === 23 && unknown === 15;
                    }
                },
                {
                    name: "Real export CSS rendered: text 15/18/23 px, headings unchanged (h1 42 px, h2 31.5 px), h6 never below the text, table follows the text",
                    test: async function() {
                        const themes = await fetch("../preview-themes.css").then(r => r.text());
                        // Fonts left out: the file CSP allows data: fonts only, and sizes do not need them.
                        const css = ExportHTML.buildExportCSS(ExportHTML.filterMarkdownBodyCSS(themes)).replace(/@font-face\s*\{[^}]*\}/g, "");
                        const results = [];
                        for (const size of [15, 18, 23]) {
                            const html = ExportHTML.buildStandaloneHTML("T", "<h1>A</h1><h2>B</h2><h6>F</h6><p>text</p><table><tr><td>c</td></tr></table>", css, "en", false, size);
                            const frame = document.createElement("iframe");
                            frame.style.cssText = "position:absolute;left:-9999px;width:800px;height:400px";
                            document.body.appendChild(frame);
                            frame.contentDocument.open();
                            frame.contentDocument.write(html);
                            frame.contentDocument.close();
                            const doc = frame.contentDocument;
                            const fs = sel => getComputedStyle(doc.querySelector(".markdown-body " + sel)).fontSize;
                            results.push([fs("p"), fs("h1"), fs("h2"), fs("h6"), fs("table")].join(" "));
                            frame.remove();
                        }
                        const expected = ["15px 42px 31.5px 15px 15px", "18px 42px 31.5px 18px 18px", "23px 42px 31.5px 23px 23px"];
                        if (results.join("|") !== expected.join("|")) throw new Error("got " + results.join(" | "));
                        return true;
                    }
                },
                {
                    name: "Real preview-themes.css: export keeps the switches, no preview-dark left, every variable defined in style.css :root or in the preview CSS",
                    test: async function() {
                        const [themes, app] = await Promise.all([
                            fetch("../preview-themes.css").then(r => r.text()),
                            fetch("../style.css").then(r => r.text())
                        ]);
                        const css = ExportHTML.rewriteDarkSelectors(ExportHTML.filterMarkdownBodyCSS(themes));
                        if (css.includes("preview-dark")) return false;
                        if (!css.includes("body:has(#fmk-export-dark:checked) .markdown-body h1")) return false;
                        if (!css.includes(".fmk-export-theme-switch")) return false;
                        if (!css.includes(".fmk-export-text-switch")) return false;
                        if (!css.includes("body:has(#fmk-export-text-18:checked) .markdown-body")) return false;
                        if (!css.includes("body:has(#fmk-export-text-23:checked) .markdown-body")) return false;
                        if (!css.includes(".fmk-export-page:has(#fmk-export-dark:checked)")) return false;
                        if (css.includes("d2h")) return false;
                        const rootMatch = app.match(/:root\s*\{([\s\S]*?)\n\}/);
                        if (!rootMatch) return false;
                        const names = [...new Set([...css.matchAll(/var\(\s*(--[\w-]+)/g)].map(m => m[1]))];
                        // A variable the preview CSS declares itself (text size) needs no app value.
                        const declared = n => new RegExp("(^|[\\s;{])" + n + "\\s*:").test(css);
                        const missing = names.filter(n => !declared(n) && !new RegExp("(^|\\s)" + n + "\\s*:").test(rootMatch[1]));
                        if (missing.length) throw new Error("not in style.css :root: " + missing.join(", "));
                        return names.length > 0;
                    }
                }
            ];

            let passed = 0;
            let total = testCases.length;

            (async () => {
            for (const [index, tc] of testCases.entries()) {
                let isPass = false;
                let errMessage = null;
                try {
                    isPass = await tc.test();
                } catch (e) {
                    errMessage = e.message;
                }

                if (isPass) {
                    passed++;
                }

                const card = document.createElement('div');
                card.className = `test-case ${isPass ? 'pass' : 'fail'}`;

                const badge = document.createElement('span');
                badge.className = `badge ${isPass ? 'pass' : 'fail'}`;
                badge.textContent = isPass ? 'PASS' : 'FAIL';

                const title = document.createElement('span');
                title.textContent = `Case ${index + 1}: ${tc.name}`;

                card.appendChild(badge);
                card.appendChild(title);

                if (!isPass && errMessage) {
                    const diff = document.createElement('div');
                    diff.className = 'diff-details';
                    diff.textContent = `Error: ${errMessage}`;
                    card.appendChild(diff);
                }

                container.appendChild(card);
            }

            const summaryText = `${passed}/${total} passed`;
            summaryEl.className = `summary ${passed === total ? 'passed' : 'failed'}`;
            summaryEl.textContent = summaryText;

            console.log(`Unit Tests - Export HTML: ${summaryText}`);
            })();
        })();
    </script>
</body>
</html>
