<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Tests - Outline Heading Shift</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1e1e1e;
            color: #d4d4d4;
            margin: 20px;
            line-height: 1.5;
        }
        h1 {
            color: #569cd6;
            font-size: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }
        .summary {
            font-weight: bold;
            font-size: 16px;
            margin: 15px 0;
            padding: 10px;
            border-radius: 4px;
        }
        .summary.passed {
            background-color: #1e3a1e;
            color: #4ec9b0;
            border: 1px solid #2e5a2e;
        }
        .summary.failed {
            background-color: #3a1e1e;
            color: #f44747;
            border: 1px solid #5a2e2e;
        }
        .test-case {
            margin-bottom: 8px;
            padding: 8px 12px;
            border-radius: 4px;
            background-color: #252526;
            font-family: monospace;
            font-size: 13px;
        }
        .test-case.pass {
            border-left: 4px solid #4ec9b0;
        }
        .test-case.fail {
            border-left: 4px solid #f44747;
        }
        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
            margin-right: 8px;
            font-size: 11px;
        }
        .badge.pass {
            background-color: #4ec9b0;
            color: #1e1e1e;
        }
        .badge.fail {
            background-color: #f44747;
            color: #ffffff;
        }
        .diff-details {
            margin-top: 6px;
            padding: 6px;
            background-color: #1a1a1a;
            border-radius: 3px;
            color: #ce9178;
            white-space: pre-wrap;
        }
    </style>
    <script src="../plugins/ext-outline.js"></script>
</head>
<body>
    <h1>Unit Tests - Outline Heading Shift</h1>
    <div id="summary" class="summary">Running tests...</div>
    <div id="test-results"></div>

    <script>
        (function() {
            const Outline = window.FamousPluginCore && window.FamousPluginCore.Outline;
            const container = document.getElementById('test-results');
            const summaryEl = document.getElementById('summary');

            if (!Outline || typeof Outline.shiftHeadingLines !== 'function') {
                summaryEl.className = 'summary failed';
                summaryEl.textContent = 'Error: Outline.shiftHeadingLines is not defined';
                console.error('Error: Outline.shiftHeadingLines is not defined');
                return;
            }

            const testCases = [
                {
                    name: '["## A", "text", "### B"], +1 gives ["### A", "text", "#### B"], changed 2',
                    lines: ["## A", "text", "### B"],
                    delta: 1,
                    startsInFence: false,
                    expectedLines: ["### A", "text", "#### B"],
                    expectedChanged: 2
                },
                {
                    name: 'same input, -1 gives ["# A", "text", "## B"], changed 2',
                    lines: ["## A", "text", "### B"],
                    delta: -1,
                    startsInFence: false,
                    expectedLines: ["# A", "text", "## B"],
                    expectedChanged: 2
                },
                {
                    name: '["# A"], -1 gives ["# A"], changed 0',
                    lines: ["# A"],
                    delta: -1,
                    startsInFence: false,
                    expectedLines: ["# A"],
                    expectedChanged: 0
                },
                {
                    name: '["###### F"], +1 gives ["###### F"], changed 0',
                    lines: ["###### F"],
                    delta: 1,
                    startsInFence: false,
                    expectedLines: ["###### F"],
                    expectedChanged: 0
                },
                {
                    name: '["#hashtag", "text"], +1 unchanged, changed 0 (no space after #, not a heading)',
                    lines: ["#hashtag", "text"],
                    delta: 1,
                    startsInFence: false,
                    expectedLines: ["#hashtag", "text"],
                    expectedChanged: 0
                },
                {
                    name: '["#"], +1 gives ["##"], changed 1 (empty heading)',
                    lines: ["#"],
                    delta: 1,
                    startsInFence: false,
                    expectedLines: ["##"],
                    expectedChanged: 1
                },
                {
                    name: '["## A", "```", "# code", "```", "## B"], +1 gives ["### A", "```", "# code", "```", "### B"], changed 2',
                    lines: ["## A", "```", "# code", "```", "## B"],
                    delta: 1,
                    startsInFence: false,
                    expectedLines: ["### A", "```", "# code", "```", "### B"],
                    expectedChanged: 2
                },
                {
                    name: '["# code", "```"] with startsInFence = true, +1 unchanged, changed 0',
                    lines: ["# code", "```"],
                    delta: 1,
                    startsInFence: true,
                    expectedLines: ["# code", "```"],
                    expectedChanged: 0
                },
                {
                    name: '["    # indented"], +1 unchanged (indented code, not a heading)',
                    lines: ["    # indented"],
                    delta: 1,
                    startsInFence: false,
                    expectedLines: ["    # indented"],
                    expectedChanged: 0
                }
            ];

            let passed = 0;
            let total = testCases.length;

            testCases.forEach((tc, index) => {
                const result = Outline.shiftHeadingLines(tc.lines, tc.delta, tc.startsInFence);
                const linesMatch = JSON.stringify(result.lines) === JSON.stringify(tc.expectedLines);
                const changedMatch = result.changed === tc.expectedChanged;
                const isPass = linesMatch && changedMatch;

                if (isPass) {
                    passed++;
                }

                const card = document.createElement('div');
                card.className = `test-case ${isPass ? 'pass' : 'fail'}`;

                const badge = document.createElement('span');
                badge.className = `badge ${isPass ? 'pass' : 'fail'}`;
                badge.textContent = isPass ? 'PASS' : 'FAIL';

                const title = document.createElement('span');
                title.textContent = `Case ${index + 1}: ${tc.name}`;

                card.appendChild(badge);
                card.appendChild(title);

                if (!isPass) {
                    const diff = document.createElement('div');
                    diff.className = 'diff-details';
                    diff.textContent = `Expected: lines=${JSON.stringify(tc.expectedLines)}, changed=${tc.expectedChanged}\nActual:   lines=${JSON.stringify(result.lines)}, changed=${result.changed}`;
                    card.appendChild(diff);
                }

                container.appendChild(card);
            });

            const summaryText = `${passed}/${total} passed`;
            summaryEl.className = `summary ${passed === total ? 'passed' : 'failed'}`;
            summaryEl.textContent = summaryText;

            console.log(`Unit Tests - Outline Heading Shift: ${summaryText}`);
        })();
    </script>
</body>
</html>
